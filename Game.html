


<!DOCTYPE html>
<html>
<head>
<title>Memory Match Game</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #e4f1e8;
    color: #315b48;
}

h1 {
    color: #28634b;
    margin-top: 25px;
}

.game {
    display: grid;
    grid-template-columns: repeat(5, 75px);
    gap: 12px;
    justify-content: center;
    margin: 25px auto;
}

.card {
    height: 75px;
    width: 75px;
    font-size: 30px;
    border: 2px solid #b5d6c2;
    border-radius: 12px;
    background: white;
    cursor: pointer;
    box-shadow: 0 3px 6px #b5d6c2;
}

.card:hover {
    background: #cce8d5;
}

.card:disabled {
    cursor: default;
    opacity: 0.7;
}

#message {
    color: #26734d;
    font-size: 22px;
}

#restart {
    background: #397b5b;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 16px;
}
</style>
</head>

<body>

<h1>🌿 Memory Match Game 🌿</h1>
<p>Find all 7 matching pairs!</p>

<h3 id="score">Matches: 0 / 7</h3>

<div class="game" id="game"></div>

<h3 id="message"></h3>

<button id="restart" onclick="startGame()">
Restart Game
</button>

<script>

let emojis = [
    '🐱','🐶','🐼','🦊','🐸','🐵','🦋',
    '🐱','🐶','🐼','🦊','🐸','🐵','🦋',
    '⭐'
];

let first = null;
let second = null;
let lock = false;
let matched = 0;

function startGame() {

    let game = document.getElementById("game");

    game.innerHTML = "";
    first = null;
    second = null;
    lock = false;
    matched = 0;

    document.getElementById("score").textContent =
    "Matches: 0 / 7";

    document.getElementById("message").textContent = "";

    emojis.sort(() => Math.random() - 0.5);

    emojis.forEach(emoji => {

        let card = document.createElement("button");

        card.className = "card";
        card.textContent = "?";

        card.onclick = function() {

            if (lock || card.textContent !== "?") return;

            card.textContent = emoji;

            if (first === null) {
                first = card;
            }
            else {
                second = card;
                lock = true;

                if (first.textContent === second.textContent) {

                    matched++;

                    first.disabled = true;
                    second.disabled = true;

                    first = null;
                    second = null;
                    lock = false;

                    document.getElementById("score").textContent =
                    "Matches: " + matched + " / 7";

                    if (matched === 7) {
                        document.getElementById("message")
                        .textContent = "🎉 Congratulations! You Won!";
                    }

                }
                else {

                    setTimeout(() => {

                        first.textContent = "?";
                        second.textContent = "?";

                        first = null;
                        second = null;
                        lock = false;

                    }, 800);

                }
            }
        };

        game.appendChild(card);

    });
}

startGame();

</script>

</body>
</html>
